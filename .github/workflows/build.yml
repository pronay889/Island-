name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip DynamicIsland.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - run: cd DynamicIsland && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: DynamicIsland/app/build/outputs/apk/debug/app-debug.apk
